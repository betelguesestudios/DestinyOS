<!doctype html>
<html>
<head>
    <link rel="icon" href="data:;base64,=">
    <script src="build/libv86.js"></script>
    <style>
        body{
            background-color: black;
        }
    </style>
</head>
<body>
    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace; line-height: 1.5"></div>
        <canvas></canvas>
    </div>
    
    <script>
        window.onload = function() {
            // Function to get the latest release URL
            async function getLatestReleaseUrl() {
                try {
                    const response = await fetch('https://api.github.com/repos/betelguesestudios/DestinyOS/releases/latest');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const releaseData = await response.json();
                    const isoAsset = releaseData.assets.find(asset => 
                        asset.name.endsWith('.iso') || asset.name.includes('DestinyOS.iso')
                    );
                    
                    if (isoAsset) {
                        return isoAsset.browser_download_url;
                    } else {
                        console.warn('No ISO asset found, using tag download URL');
                        return `https://github.com/betelguesestudios/DestinyOS/releases/download/${releaseData.tag_name}/DestinyOS.iso`;
                    }
                } catch (error) {
                    console.error('Error fetching latest release:', error);
                    return 'DestinyOS/bin/Debug/net6.0/DestinyOS.iso';
                }
            }
            async function initEmulator() {
                const isoUrl = await getLatestReleaseUrl();
                console.log('Using ISO from:', isoUrl);
                
                var emulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { url: isoUrl },
                    wasm_path: "build/v86.wasm",
                    autostart: true,
                });
            }

            // Start the emulator
            initEmulator();
        }
    </script>
</body>
</html>
