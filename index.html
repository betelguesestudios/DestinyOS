<!doctype html>
<html>
<head>
    <link rel="icon" href="data:;base64,=">
    <script src="build/libv86.js"></script>
    <style>
        body{
            background-color: black;
        }
    </style>
</head>
<body>
    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace; line-height: 1.5"></div>
        <canvas></canvas>
    </div>
    
    <script>
        window.onload = async function() {
            try {
                const response = await fetch('https://api.github.com/repos/betelguesestudios/DestinyOS/releases/latest');
                const release = await response.json();
                const isoAsset = release.assets.find(asset => asset.name.endsWith('.iso'));
                
                if (!isoAsset) {
                    throw new Error('No ISO file found in the latest release');
                }
                const isoUrl = isoAsset.browser_download_url;
                
                console.log('Using ISO from:', isoUrl);
                
                var emulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { url: isoUrl },
                    wasm_path: "build/v86.wasm",
                    autostart: true,
                });
            } catch (error) {
                console.error('Failed to fetch latest release:', error);
                var emulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { url: "https://github.com/betelguesestudios/DestinyOS/releases/latest/download/DestinyOS.iso" },
                    wasm_path: "build/v86.wasm",
                    autostart: true,
                });
            }
        }
    </script>
</body>
</html>
